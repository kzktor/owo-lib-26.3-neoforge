modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/wisp-forest/owo-lib/issues"

[[mods]]
	modId = "owo"
	version = "${version}"
	displayName = "oωo (config)"
	authors = "glisco"
	credits = "Blodhgarm, BasiqueEvangelist, Noaaan, chyzman"
	description = '''
A reduced NeoForge port of oωo-lib carrying only the config subsystem.
Config values are read from and written to config/<name>.json5; the owo-ui
config screen is not included in this port.
'''
	iconFile = "assets/owo/icon.png"

[[mixins]]
	config = "owo.mixins.json"

[[dependencies.owo]]
	modId = "minecraft"
	type = "required"
	versionRange = "[26.3,)"
	ordering = "NONE"
	side = "BOTH"

[[dependencies.owo]]
	modId = "neoforge"
	type = "required"
	versionRange = "[26.3.0.40-beta,)"
	ordering = "NONE"
	side = "BOTH"
