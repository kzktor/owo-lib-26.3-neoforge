plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.13.2+26.3'
group = 'io.wispforest'

base {
    archivesName = 'owo-lib'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}



neoForge {
    version = project.neo_version

    mods {
        owo {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // endec / jankson are plain Java libraries with no Minecraft or loader coupling,
    // so the upstream versions work unchanged.
    // These are plain Java libraries, not mods: `api` only makes them visible at compile time.
    // They have to be jar-in-jar'd so the game actually gets them at runtime (upstream owo-lib
    // used Loom's `include`, which is the same thing).
    api "io.wispforest:endec:0.1.12"
    api "io.wispforest.endec:jankson:0.1.7"
    api "io.wispforest.endec:gson:0.1.7"
    api "io.wispforest.endec:netty:0.1.6"
    api "blue.endless:jankson:1.2.2"

    jarJar "io.wispforest:endec:0.1.12"
    jarJar "io.wispforest.endec:jankson:0.1.7"
    jarJar "io.wispforest.endec:gson:0.1.7"
    jarJar "io.wispforest.endec:netty:0.1.6"
    jarJar "blue.endless:jankson:1.2.2"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << '-Xmaxerrs' << '500'
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [version: project.version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
